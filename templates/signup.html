<!DOCTYPE html>
<html>
<head>

    <title>Signup</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="form-container">

    <h2>✨ Create Account</h2>

    <form method="POST">

        <input
        type="text"
        name="name"
        placeholder="Full Name"
        required>

        <input
        type="text"
        name="phone"
        placeholder="Phone Number"
        required>

        <input
        type="email"
        name="email"
        placeholder="Email"
        required>

        <input
        type="password"
        name="password"
        placeholder="Password"
        required>

        <button class="btn">
            Sign Up 🚀
        </button>

    </form>

</div>

</body>
</html>
